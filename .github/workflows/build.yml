name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onedir --name Sounder
              --collect-all qfluentwidgets main.py
      - run: Compress-Archive -Path dist/Sounder -DestinationPath Sounder-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sounder-Windows-x64
          path: Sounder-Windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onedir --name Sounder
              --collect-all qfluentwidgets main.py
      - run: tar -czf Sounder-Linux-x64.tar.gz -C dist Sounder
      - uses: actions/upload-artifact@v4
        with:
          name: Sounder-Linux-x64
          path: Sounder-Linux-x64.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: 'true'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Sounder-Windows-x64.zip
            Sounder-Linux-x64.tar.gz
